[Interface]
# آدرس IP داخلی سرور وایرگارد
Address = 10.0.0.1/24
# پورت داخلی UDP که وایرگارد روی آن گوش می‌دهد
ListenPort = 51820
# کلید خصوصی سرور (این را با یک کلید واقعی جایگزین کنید)
PrivateKey = <SERVER_PRIVATE_KEY>

# فعال‌سازی NAT برای عبور ترافیک اینترنت
PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

[Peer]
# کلید عمومی کلاینت (این را با کلید عمومی کلاینت خود جایگزین کنید)
PublicKey = <CLIENT_PUBLIC_KEY>
# آدرس IP اختصاصی کلاینت
AllowedIPs = 10.0.0.2/32